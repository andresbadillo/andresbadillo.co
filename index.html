<!doctype html>
<html lang="es">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Andres Badillo — Product Manager, Data Analyst y Frontend Developer</title>
    <!--
      Metadatos por defecto. LinkedIn, WhatsApp y X no ejecutan JavaScript: solo ven estos.
      data-rh="true" permite que el componente Seo los sustituya en cada página (sin duplicarlos).
    -->
    <meta
      name="description"
      content="Portfolio de Andres Badillo: MBA, Product Manager, Data Analyst y Frontend Developer. Proyectos, artículos y contacto."
      data-rh="true"
    />
    <link rel="canonical" href="https://andresbadillo.co/" data-rh="true" />
    <meta property="og:type" content="website" data-rh="true" />
    <meta property="og:site_name" content="Andres Badillo" data-rh="true" />
    <meta property="og:locale" content="es_CO" />
    <meta property="og:title" content="Andres Badillo — Product Manager, Data Analyst y Frontend Developer" data-rh="true" />
    <meta
      property="og:description"
      content="Portfolio de Andres Badillo: MBA, Product Manager, Data Analyst y Frontend Developer. Proyectos, artículos y contacto."
      data-rh="true"
    />
    <meta property="og:url" content="https://andresbadillo.co/" data-rh="true" />
    <meta property="og:image" content="https://andresbadillo.co/og-image.png" data-rh="true" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Andrés Badillo, Product Manager, Data Analyst y Frontend Developer" />
    <meta name="twitter:card" content="summary_large_image" data-rh="true" />
    <meta name="twitter:title" content="Andres Badillo — Product Manager, Data Analyst y Frontend Developer" data-rh="true" />
    <meta
      name="twitter:description"
      content="Portfolio de Andres Badillo: MBA, Product Manager, Data Analyst y Frontend Developer. Proyectos, artículos y contacto."
      data-rh="true"
    />
    <meta name="twitter:image" content="https://andresbadillo.co/og-image.png" data-rh="true" />
    <!-- Datos estructurados para buscadores (bloque de datos, no se ejecuta). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Andrés Badillo",
        "url": "https://andresbadillo.co/",
        "image": "https://andresbadillo.co/og-image.png",
        "jobTitle": "Product Manager",
        "email": "mailto:r.andres.badillo@gmail.com",
        "sameAs": [
          "https://github.com/andresbadillo",
          "https://www.linkedin.com/in/raul-andres-badillo-jaimes/",
          "https://www.instagram.com/andresbadillo.co",
          "https://www.tiktok.com/@andresbadillo.co"
        ]
      }
    </script>

    <meta name="theme-color" content="#1a1a1a" />

    <link rel="icon" href="/favicon.svg" />
    <!-- Pone data-theme antes del primer pintado (archivo externo: la CSP no admite scripts inline) -->
    <script src="/theme-init.js"></script>
    <!-- Inter llega antes que el CSS: evita el salto de fuente en el hero (Vite le añade el hash al compilar) -->
    <link rel="preload" href="/src/assets/fonts/Inter-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Oculta el skip-link antes de que cargue el bundle (evita FOUC del enlace) -->
    <style>
      .skip-link {
        position: absolute;
        top: -100%;
        left: 1rem;
        z-index: 9999;
        background: #f2a36b;
        color: #111;
        padding: 0.5rem 0.75rem;
        border-radius: 0.4rem;
      }
      .skip-link:focus {
        top: 1rem;
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Saltar al contenido</a>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
