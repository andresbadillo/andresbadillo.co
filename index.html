<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Andres Badillo</title>
    <meta
      name="description"
      content="Portfolio de Andres Badillo."
    />

    <meta property="og:title" content="Portfolio de Andres Badillo" />
    <meta
      property="og:description"
      content="Portfolio de Andres Badillo"
    />
    <meta property="og:type" content="website" />

    <meta name="theme-color" content="#1a1a1a" />

    <link rel="icon" href="/favicon.svg" />
    <!-- Pone data-theme antes del primer pintado (archivo externo: la CSP no admite scripts inline) -->
    <script src="/theme-init.js"></script>
    <!-- Inter llega antes que el CSS: evita el salto de fuente en el hero (Vite le añade el hash al compilar) -->
    <link rel="preload" href="/src/assets/fonts/Inter-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Oculta el skip-link antes de que cargue el bundle (evita FOUC del enlace) -->
    <style>
      .skip-link {
        position: absolute;
        top: -100%;
        left: 1rem;
        z-index: 9999;
        background: #f2a36b;
        color: #111;
        padding: 0.5rem 0.75rem;
        border-radius: 0.4rem;
      }
      .skip-link:focus {
        top: 1rem;
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Saltar al contenido</a>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
